<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8ef0"/>
      <stop offset="1" stop-color="#1f5fc4"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8effa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2e6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centered in a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- speech bubble with a tail at the lower left -->
  <g filter="url(#shadow)">
    <path d="M300 250 H724 A96 96 0 0 1 820 346 V592 A96 96 0 0 1 724 688 H452
             L318 792 L346 688 H300 A96 96 0 0 1 204 592 V346 A96 96 0 0 1 300 250 Z"
          fill="url(#bubble)"/>
  </g>
  <text x="470" y="560" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="300" font-weight="700" fill="#1f5fc4">Aa</text>
  <!-- correction badge -->
  <circle cx="742" cy="676" r="118" fill="#3c9d4f" stroke="#ffffff" stroke-width="22"/>
  <path d="M686 680 L728 722 L804 636" fill="none" stroke="#ffffff"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
